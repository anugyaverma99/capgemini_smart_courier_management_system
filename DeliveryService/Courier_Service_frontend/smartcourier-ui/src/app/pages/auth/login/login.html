<main class="auth-page">
  <section class="auth-card">
    <div class="brand">
      <span>📦</span>
      <h1>SmartCourier</h1>
    </div>
    <h2>Welcome Back</h2>
    <p>Login to manage deliveries and tracking.</p>

    @if (errorMessage()) {
      <div class="error-box">{{ errorMessage() }}</div>
    }

    <form class="auth-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Email</label>
        <input class="form-input" type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-input" type="password" [(ngModel)]="password" name="password" placeholder="Enter password" />
      </div>
      <button class="submit-btn" type="submit" [disabled]="loading()">{{ loading() ? 'Logging in...' : 'Login' }}</button>
    </form>

    <p class="switch-link">New to SmartCourier? <a routerLink="/signup">Create account</a></p>
  </section>
</main>
