<main class="auth-page">
  <section class="auth-card">
    <div class="brand">
      <span>📦</span>
      <h1>SmartCourier</h1>
    </div>
    <h2>Create Account</h2>
    <p>Sign up to start sending and tracking packages.</p>

    @if (errorMessage()) {
      <div class="error-box">{{ errorMessage() }}</div>
    }

    <form class="auth-form" (ngSubmit)="onSignup()">
      <div class="form-group">
        <label>Full Name</label>
        <input class="form-input" type="text" [(ngModel)]="fullName" name="fullName" placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input class="form-input" type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input class="form-input" type="tel" [(ngModel)]="phone" name="phone" placeholder="10-digit number" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-input" type="password" [(ngModel)]="password" name="password" placeholder="Create a password" />
      </div>
      <button class="submit-btn" type="submit" [disabled]="loading()">{{ loading() ? 'Creating account...' : 'Sign Up' }}</button>
    </form>

    <p class="switch-link">Already have an account? <a routerLink="/login">Login</a></p>
  </section>
</main>
